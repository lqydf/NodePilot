<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NodePilot - 亚洲用户网络节点质量监测与 TOP 10 推荐">
  <title>NodePilot · 今日 TOP 10</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="nav">
    <div class="brand"><span class="brand-mark">N</span><span>NodePilot</span></div>
    <div class="nav-status"><span class="dot"></span> 数据监测中</div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">ASIA NETWORK QUALITY</div>
      <h1>今日 TOP 10</h1>
      <p>自动测试公开节点的延迟、速度、丢包与稳定性，为亚洲用户筛选综合表现更好的线路。</p>
      <div class="hero-meta">
        <span>最后更新：今天 02:35</span>
        <span>已测试：12,846 个候选节点</span>
        <span>下次更新：18 分钟</span>
      </div>
    </section>

    <section class="toolbar">
      <div>
        <strong>推荐节点</strong>
        <span class="muted">按综合评分排序</span>
      </div>
      <button id="refreshBtn" class="refresh">刷新排名</button>
    </section>

    <section id="nodes" class="node-list"></section>

    <section class="subscribe-card">
      <div>
        <div class="eyebrow">TOP 10 SUBSCRIPTION</div>
        <h2>一键获取今日 TOP 10</h2>
        <p>当前为 V1 首页预览，订阅接口将在后端完成后接入。</p>
      </div>
      <div class="subscription-row">
        <code id="subUrl">https://nodepilot.example/api/sub/top10</code>
        <button id="copyBtn">复制地址</button>
      </div>
    </section>
  </main>

  <footer>
    <span>NodePilot V1 Preview</span>
    <span>数据仅用于网络质量测试展示</span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
