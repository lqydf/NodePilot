name: 自动抓取真实节点

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '0 */4 * * *'    # 每4小时运行一次

jobs:
  build:
    runs-on: ubuntu-latest

    # 授予写入仓库的权限（解决 git push 报错 exit 128）
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install aiohttp

      - name: 运行真实节点探测脚本
        run: python backend/generate_snapshot.py

      - name: 提交更新到仓库（即使空文件也提交）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/
          git diff --staged --quiet || git commit -m "🤖 自动更新节点数据"
          git push
