name: 自动抓取真实节点

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 修复 git push 权限

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install aiohttp

      - name: 运行真实节点探测脚本
        run: python backend/generate_snapshot.py

      - name: 提交更新到仓库（如果有数据）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 只有 frontend/data 目录存在且非空时才提交
          if [ -d "frontend/data" ] && [ "$(ls -A frontend/data 2>/dev/null)" ]; then
            git add frontend/data/
            git diff --staged --quiet || git commit -m "🤖 自动更新可用节点数据"
            git push
          else
            echo "📭 frontend/data 目录不存在或为空，本次无节点可更新，跳过提交。"
          fi
