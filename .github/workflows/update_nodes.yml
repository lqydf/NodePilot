name: 自动抓取真实节点

on:
  # 支持手动触发（在 Actions 页面点按钮运行）
  workflow_dispatch:
  # 每 4 小时自动运行一次
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    # 👇 关键修复：授予写入仓库内容的权限，解决 exit code 128 错误
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4   # 已兼容 Node.js 24

      - name: 安装 Python
        uses: actions/setup-python@v5   # 已兼容 Node.js 24
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install aiohttp

      - name: 运行真实节点探测脚本
        run: python backend/generate_snapshot.py

      - name: 提交更新到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/
          # 如果没有任何文件变化（例如没有存活节点），则跳过提交
          git diff --staged --quiet || git commit -m "🤖 自动更新可用节点数据"
          git push
